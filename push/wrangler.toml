# Soukromý klíč VAPID se do repozitáře nedává: npx wrangler secret put VAPID_PRIVATE
name = "smenovnik-push"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
PROJECT_ID = "smenovnik-eb4e1"
ORIGINS = "https://se1ky0.github.io"
VAPID_SUBJECT = "https://se1ky0.github.io/Sm-novn-k/"
VAPID_PUBLIC = "BBzPlOwpemSPY0gOHxB7KyYG1E30X3oe4ZAGacHyPQpx_EIKT42B394kfeu63skfK8GfnLwZLVBhZ0e6L3ZnOzA"

# přihlášené telefony (klíč s:{kód týmu}:{uid})
[[kv_namespaces]]
binding = "SUBS"
id = "DOPLNI_SE_PO_VYTVORENI"
