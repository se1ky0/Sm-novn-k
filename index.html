<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Směnovník</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Směnovník">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#f2f4f7;--card:#fff;--card2:#f6f8fa;--ink:#101c26;--mut:#5c6b78;--line:#e1e6eb;--acc:#0f766e;--acci:#fff;--accs:#d3eeea;--v:#94a3b1;--warn:#b45309;--warnbg:#fef3c7;--err:#b91c1c;--errbg:#fee2e2;--kon:#6d28d9;--konbg:#ede9fe;--tint:12%;--tint2:22%;--glow1:rgba(20,184,166,.22);--glow2:rgba(245,158,11,.18);--glow3:rgba(99,102,241,.14);--sh:0 1px 2px rgba(16,28,38,.05),0 8px 22px -10px rgba(16,28,38,.18);--ov:rgba(10,20,28,.45);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1117;--card:#151e27;--card2:#1b2631;--ink:#e9eff4;--mut:#94a4b2;--line:#26333f;--acc:#2dd4bf;--acci:#04221e;--accs:#143d38;--v:#6b7a88;--warn:#fcd34d;--warnbg:#3b2f0b;--err:#fca5a5;--errbg:#451a1a;--kon:#c4b5fd;--konbg:#2e2150;--tint:16%;--tint2:30%;--glow1:rgba(45,212,191,.16);--glow2:rgba(245,158,11,.10);--glow3:rgba(129,140,248,.14);--sh:none;--ov:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1117;--card:#151e27;--card2:#1b2631;--ink:#e9eff4;--mut:#94a4b2;--line:#26333f;--acc:#2dd4bf;--acci:#04221e;--accs:#143d38;--v:#6b7a88;--warn:#fcd34d;--warnbg:#3b2f0b;--err:#fca5a5;--errbg:#451a1a;--kon:#c4b5fd;--konbg:#2e2150;--tint:16%;--tint2:30%;--glow1:rgba(45,212,191,.16);--glow2:rgba(245,158,11,.10);--glow3:rgba(129,140,248,.14);--sh:none;--ov:rgba(0,0,0,.6);color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding:16px 0 calc(90px + env(safe-area-inset-bottom,0px))}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
/* barevná záře v pozadí horní části */
body:before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:520px;pointer-events:none;background:radial-gradient(60% 70% at 0% 0%,var(--glow1),transparent 70%),radial-gradient(50% 60% at 100% 5%,var(--glow2),transparent 70%),radial-gradient(40% 50% at 60% 40%,var(--glow3),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
h1,h2,h3{margin:0;letter-spacing:-.015em}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mut{color:var(--mut)}
/* ---------- hlavička a navigace ---------- */
.top{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 6px}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:44px;height:44px;border-radius:14px;flex:none;box-shadow:0 6px 16px -6px rgba(15,118,110,.6)}
h1{font-size:21px;line-height:1.15}
.sub{font-size:14px;color:var(--mut)}
main{max-width:1100px;margin:0 auto;padding:4px 16px calc(108px + env(safe-area-inset-bottom,0px))}
.v{display:none}
body[data-t=tyden] #tyden,body[data-t=kal] #kal,body[data-t=tym] #tym,body[data-t=nast] #nast{display:block}
section>h2{font-size:24px;margin:10px 0 12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-top:1px solid var(--line)}
nav.tabs button{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border:0;background:none;color:var(--mut);font-size:12px;font-weight:650}
nav.tabs .pi{position:relative;display:grid;place-items:center;width:58px;height:32px;border-radius:16px;transition:background .25s,color .25s}
body[data-t=tyden] nav [data-t=tyden],body[data-t=kal] nav [data-t=kal],body[data-t=tym] nav [data-t=tym],body[data-t=nast] nav [data-t=nast]{color:var(--ink)}
body[data-t=tyden] nav [data-t=tyden] .pi,body[data-t=kal] nav [data-t=kal] .pi,body[data-t=tym] nav [data-t=tym] .pi,body[data-t=nast] nav [data-t=nast] .pi{background:var(--acc);color:var(--acci)}
nav .ld{display:none}
.badge{position:absolute;top:-4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--card)}
.badge:empty{display:none}
/* ---------- lidé ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;min-height:42px;padding:0 15px 0 6px;border-radius:21px;border:1px solid var(--line);background:var(--card);font-weight:650;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.rem .av{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--c)}
.av{width:30px;height:30px;border-radius:50%;flex:none;background:var(--c);color:var(--ci);display:grid;place-items:center;font-size:13px;font-weight:800;position:relative}
.av .live{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px var(--card)}
/* ---------- karta "teď / další směna" ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;margin-bottom:18px;color:var(--bi,#fff);background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--bc) 55%,#fff) 0,transparent 60%),linear-gradient(140deg,color-mix(in srgb,var(--bc) 80%,#fff),var(--bc));box-shadow:0 14px 34px -14px color-mix(in srgb,var(--bc) 75%,transparent)}
.hero.klid{color:var(--ink);background:var(--card);box-shadow:var(--sh);border:1px solid var(--line)}
.hero .eyebrow{color:inherit;opacity:.78}
.eyebrow{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.hero-main{position:relative;display:flex;align-items:center;gap:14px;margin:10px 0 14px}
.hero-t{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.hero-s{font-size:16px;opacity:.82;font-variant-numeric:tabular-nums;font-weight:550}
.hero .pill.big{background:color-mix(in srgb,var(--bi,#fff) 18%,transparent);color:inherit;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bi,#fff) 30%,transparent)}
.stat{position:relative;display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.dot.live{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.bar{position:relative;height:8px;border-radius:4px;background:color-mix(in srgb,currentColor 20%,transparent);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;border-radius:4px}
.hero .note{color:inherit;opacity:.85}
.deco{position:absolute;right:-44px;top:-44px;width:170px;height:170px;pointer-events:none;opacity:.22;fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round}
.deco .rays{transform-origin:85px 85px;animation:spin 50s linear infinite}
.deco .fill{fill:currentColor;stroke:none}
.deco .star{fill:currentColor;stroke:none;animation:twinkle 3s ease-in-out infinite}
.deco .star:nth-of-type(2){animation-delay:1s}.deco .star:nth-of-type(3){animation-delay:2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{50%{opacity:.25}}
.pill{display:inline-grid;place-items:center;flex:none;min-width:38px;height:38px;padding:0 8px;border-radius:12px;background:var(--bc);color:var(--bi,#fff);font-weight:800;font-size:17px}
.pill.big{min-width:62px;height:62px;border-radius:19px;font-size:29px}
.pill.vol{background:transparent;color:var(--mut);box-shadow:inset 0 0 0 2px var(--line)}
/* ---------- týden ---------- */
.wnav{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.wnav .t{flex:1;text-align:center;min-width:0}
.wnav .t b{display:block;font-size:17px}
.wnav .t small{display:block;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.ib{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0;box-shadow:var(--sh)}
.zpet{border:0;background:var(--acc);color:var(--acci);font-weight:750;font-size:12px;border-radius:10px;padding:2px 9px;margin-left:6px;vertical-align:1px}
.list{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 12px 12px 10px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);position:relative;overflow:hidden}
.drow.s{background:linear-gradient(90deg,color-mix(in srgb,var(--bc) var(--tint2),var(--card)),color-mix(in srgb,var(--bc) var(--tint),var(--card)));border-color:color-mix(in srgb,var(--bc) 28%,var(--line))}
.drow.s:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bc)}
.drow.past{opacity:.5}
.drow.dnes{outline:2.5px solid var(--acc);outline-offset:2px}
.dcol{width:44px;flex:none;text-align:center;line-height:1.1}
.dw{display:block;font-size:12px;font-weight:750;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.dn{display:block;font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.dnes .dw,.dnes .dn{color:var(--acc)}
.mid{flex:1;min-width:0}
.nm{display:block;font-weight:750;font-size:17px}
.tm{display:block;color:var(--mut);font-size:15px;font-variant-numeric:tabular-nums}
.note{display:block;font-size:14px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;vertical-align:2px;margin-left:7px;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:750;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.up{display:block;margin-top:6px;padding:5px 9px;border-radius:9px;font-size:13px;font-weight:650}
.up.chyba{background:var(--errbg);color:var(--err)}.up.varovani{background:var(--warnbg);color:var(--warn)}.up.konflikt{background:var(--konbg);color:var(--kon)}
.anim .hero,.anim .tymh,.anim .list>*,.anim .cal>*,.anim .tgrid>*,.anim .fi,.anim .nowc{animation:rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* ---------- kalendář ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-h{font-size:12px;font-weight:750;color:var(--mut);text-align:center;padding:0 0 3px;text-transform:uppercase;letter-spacing:.04em}
.cc{position:relative;min-width:0;aspect-ratio:1/1.08;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:13px;border:1px solid var(--line);background:var(--card);padding:2px}
.cc.s{background:color-mix(in srgb,var(--bc) var(--tint2),var(--card));border-color:color-mix(in srgb,var(--bc) 30%,transparent)}
.cn{font-size:12px;font-weight:650;color:var(--mut);font-variant-numeric:tabular-nums}
.ck{font-size:19px;font-weight:800;line-height:1;color:color-mix(in srgb,var(--bc) 78%,var(--ink))}
.cc.v .ck{font-size:13px;font-weight:600;color:var(--v)}
.ct{display:none;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.cc.out{opacity:.35}
.cc.dnes{background:var(--acc);border-color:var(--acc)}
.cc.dnes .cn,.cc.dnes .ck,.cc.dnes .ct{color:var(--acci)}
.cc.vyj{border:1.5px dashed color-mix(in srgb,var(--bc) 65%,var(--ink))}
.wd{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%}
.wd.chyba{background:var(--err)}.wd.varovani{background:var(--warn)}.wd.konflikt{background:var(--kon)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 2px 4px;font-size:13px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;background:color-mix(in srgb,var(--bc) var(--tint2),var(--card));border:1px solid color-mix(in srgb,var(--bc) 45%,transparent)}
.sw.d{background:none;border:1.5px dashed var(--mut)}
.sw.o{border-radius:50%;width:8px;height:8px;background:var(--warn);border:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.st .si{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--bc);color:var(--bi);margin-bottom:8px}
.st .si .ic{width:18px;height:18px}
.st b{display:block;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.st span{font-size:13px;color:var(--mut)}
/* ---------- tým ---------- */
.tymh{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 16px;margin-bottom:16px;color:#fff;background:radial-gradient(100% 120% at 100% 0%,rgba(255,255,255,.25),transparent 55%),linear-gradient(135deg,#0f766e,#0e7490 55%,#4f46e5);box-shadow:0 14px 34px -16px rgba(14,116,144,.8)}
.tymh h3{font-size:24px;font-weight:800}
.tymh .row{align-items:center;margin-top:12px}
.kod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;background:rgba(255,255,255,.18);padding:6px 10px;border-radius:10px;font-weight:700;font-size:15px;flex:none!important}
.tymh .btn{background:#fff;color:#0f766e;border:0}
.stav{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;opacity:.92}
.stav i{width:8px;height:8px;border-radius:50%;background:#fcd34d}
.stav.online i{background:#86efac;animation:pulse 2s infinite;color:#86efac}
.stav.chyba i{background:#fca5a5}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.nowc{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:20px;background:color-mix(in srgb,var(--bc) var(--tint2),var(--card));border:1px solid color-mix(in srgb,var(--bc) 35%,transparent);text-align:left}
.nowc .av{width:38px;height:38px;font-size:14px}
.nowc b{display:block;font-size:15px;line-height:1.2}
.nowc small{display:block;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.tgrid{display:grid;grid-template-columns:minmax(70px,1.5fr) repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.tg-h{font-size:11px;font-weight:750;color:var(--mut);text-align:center;line-height:1.15;text-transform:uppercase;padding-bottom:2px}
.tg-h b{display:block;font-size:14px;color:var(--ink)}
.tg-h.dnes,.tg-h.dnes b{color:var(--acc)}
.tg-n{display:flex;align-items:center;gap:7px;min-width:0;font-weight:700;font-size:14px;border:0;background:none;padding:0;text-align:left}
.tg-n .av{width:28px;height:28px;font-size:11px}
.tg-n span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc{position:relative;height:42px;min-width:0;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15px;border:0;padding:0;background:var(--card2);color:var(--v)}
.tc.s{background:var(--bc);color:var(--bi)}
.tc.vyj:after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.tc.dnes{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.fi:first-child{border-top:0;padding-top:4px}
.fi .av{width:36px;height:36px;font-size:13px}
.fi .ft{font-size:15px}
.fi .fm{font-size:13px;color:var(--mut)}
.fi.nove .ft:after{content:"nové";margin-left:6px;padding:1px 6px;border-radius:6px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;text-transform:uppercase;vertical-align:2px}
.mini{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:7px;background:var(--bc);color:var(--bi);font-size:12px;font-weight:800;vertical-align:1px}
.mini.vol{background:none;color:var(--mut);box-shadow:inset 0 0 0 1.5px var(--line)}
.prazdne{text-align:center;color:var(--mut);padding:10px 0 4px;font-size:14px}
.intro{text-align:center;padding:8px 4px 4px}
.intro .big{font-size:44px;line-height:1}
.intro h3{justify-content:center;font-size:20px;margin:8px 0 4px}
/* ---------- karty, formuláře ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);break-inside:avoid}
.card h3{font-size:17px;display:flex;align-items:center;gap:9px;margin-bottom:2px}
.card h3 .ic{color:var(--acc);width:20px;height:20px}
.card h3 .cnt{margin-left:auto;font-size:13px;font-weight:650;color:var(--mut)}
.hint{font-size:14px;color:var(--mut);margin:4px 0 0}
.l{display:block;font-size:13px;font-weight:650;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
input[type=color]{padding:4px;width:54px;flex:none;cursor:pointer}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn .ic{width:19px;height:19px}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acci);box-shadow:0 8px 18px -10px var(--acc)}
.btn.d{color:var(--err)}
.btn.w{width:100%}
.btn.g{background:none;border-color:transparent;box-shadow:none}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:11px;background:none;font-weight:650;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--acci)}
.vzor{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.vzor button{position:relative;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:800;font-size:19px;color:var(--v)}
.vzor button.s{background:var(--bc);border-color:transparent;color:var(--bi)}
.vzor small{position:absolute;top:3px;left:6px;font-size:10px;font-weight:650;color:var(--mut)}
.vzor button.s small{color:inherit;opacity:.75}
.box{border:1px solid var(--line);border-radius:16px;padding:4px 12px 12px;margin-top:12px;background:var(--card2)}
.box input:not([type=color]){background:var(--card)}

<script>
/* Směnovník – logika rozpisu. Čistý JS, bez UI a knihoven.
 * Použití v HTML: vložit jako skript → window.Smenovnik.*; v Node module.exports.
 * Datum "YYYY-MM-DD", čas "HH:MM" (24 h), týden začíná pondělím.
 * Všechny časy se počítají nominálně (UTC aritmetika), změna letního času se ignoruje:
 * noční směna má vždy 12 h. Směna s "do" <= "od" končí následující den a počítá
 * se do dne začátku. */
(function () {
  'use strict';
  const DEN = 86400000, HOD = 3600000;
  const NASTAVENI_VYCHOZI = {
    datum_zacatku_cyklu: '2026-10-12',
    vzor: ['V','V','N','N','V','V','V','D','D','V','V','N','N','N'],
    smeny: { D: { od: '06:00', do: '18:00' }, N: { od: '18:00', do: '06:00' } },
    pravidla: { pauza_h: 11, max_hodin_cyklus: 84, max_nocnich_po_sobe: 3, min_souvisle_volno_h: 35 }
  };
  /* ---------- pomocné ---------- */
  function mod(a, n) { return ((a % n) + n) % n; }
  function dny(datum) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(datum)) throw new Error('Neplatné datum: ' + datum);
    const p = datum.split('-');
    const n = Date.UTC(+p[0], +p[1] - 1, +p[2]) / DEN;
    if (datum_z_dnu(n) !== datum) throw new Error('Neplatné datum: ' + datum);
    return n;
  }
  function datum_z_dnu(n) { return new Date(n * DEN).toISOString().slice(0, 10); }
  function cas_ms(datum, hhmm) {
    const p = datum.split('-'), c = hhmm.split(':');
    return Date.UTC(+p[0], +p[1] - 1, +p[2], +c[0], +c[1]);
  }
  function iso(ms) { return new Date(ms).toISOString().slice(0, 16); } // YYYY-MM-DDTHH:MM
  function ms_z_iso(s) { const d = s.split('T'); return cas_ms(d[0], d[1]); }
  function trvani_h(r) { return (ms_z_iso(r.do) - ms_z_iso(r.od)) / HOD; }
  const UROVEN = { prekryv: 'chyba', pauza: 'chyba', volno: 'chyba', nocni: 'varovani', max_hodin_cyklus: 'varovani' };
  function chyba(pravidlo, datum, zprava) {
    return { pravidlo: pravidlo, uroven: UROVEN[pravidlo] || 'chyba', datum: datum, zprava: zprava };
  }
  function pole(x) { return Array.isArray(x) ? x : []; }
  function serazene(rozpis) {
    return pole(rozpis).slice().sort(function (a, b) { return dny(a.datum) - dny(b.datum); });
  }
  function smeny_serazene(rozpis) {
    return pole(rozpis).filter(function (r) { return r.smena !== 'V' && r.od; })
      .map(function (r) { return { r: r, od: ms_z_iso(r.od), do: ms_z_iso(r.do) }; })
      .sort(function (a, b) { return a.od - b.od; });
  }
  function najdi_vyjimku(datum, vyjimky) {
    if (!vyjimky) return null;
    for (let i = 0; i < vyjimky.length; i++) if (vyjimky[i].datum === datum) return vyjimky[i];
    return null;
  }
  function vzor_smena(datum, nastaveni, posun) {
    const vz = nastaveni.vzor;
    // posun_dnu: vzor osoby začíná o posun dnů později než základní cyklus
    const i = mod(dny(datum) - dny(nastaveni.datum_zacatku_cyklu) - (posun || 0), vz.length);
    return vz[i];
  }
  function radek(datum, kod, nastaveni, vyj, puvodni) {
    const r = { datum: datum, smena: kod, od: null, do: null, vyjimka: false };
    if (kod !== 'V') {
      const s = nastaveni.smeny[kod];
      const od = cas_ms(datum, s.od);
      let konec = cas_ms(datum, s.do);
      if (konec <= od) konec += DEN; // přes půlnoc → další den
      r.od = iso(od); r.do = iso(konec);
    }
    if (vyj) { r.vyjimka = true; r.poznamka = vyj.poznamka || ''; r.puvodni = puvodni; }
    return r;
  }
  /* ---------- rozpis ---------- */
  // vyjimky (nepovinné): pole {datum, smena: V|D|N, poznamka} pro danou osobu
  function smena_pro_den(datum, nastaveni, posun, vyjimky) {
    const v = najdi_vyjimku(datum, vyjimky);
    if (v) {
      if (['V', 'D', 'N'].indexOf(v.smena) < 0) throw new Error('Neplatná směna ve výjimce: ' + v.smena);
      return v.smena;
    }
    return vzor_smena(datum, nastaveni, posun);
  }
  function generuj_rozpis(od, do_, nastaveni, posun, vyjimky) {
    const a = dny(od), b = dny(do_), out = [];
    for (let n = a; n <= b; n++) {
      const d = datum_z_dnu(n);
      const v = najdi_vyjimku(d, vyjimky);
      const kod = smena_pro_den(d, nastaveni, posun, vyjimky);
      out.push(radek(d, kod, nastaveni, v, v ? vzor_smena(d, nastaveni, posun) : null));
    }
    return out;
  }
  /* ---------- hodiny ---------- */
  // Okno začíná v libovolný den (datum_od) a trvá delka_dni (výchozí 7; 14 = cyklus).
  function hodiny_za_tyden(rozpis, datum_od, delka_dni) {
    const a = dny(datum_od), b = a + (delka_dni || 7) - 1;
    let smeny = 0, hodiny = 0;
    pole(rozpis).forEach(function (r) {
      if (r.smena === 'V') return;
      const d = dny(r.datum);
      if (d >= a && d <= b) { smeny++; hodiny += trvani_h(r); }
    });
    return { smeny: smeny, hodiny: hodiny };
  }
  function hodiny_za_cyklus(rozpis, datum_zacatku, delka) {
    const a = dny(datum_zacatku), b = a + (delka || 14) - 1;
    let h = 0;
    pole(rozpis).forEach(function (r) {
      if (r.smena === 'V') return;
      const d = dny(r.datum);
      if (d >= a && d <= b) h += trvani_h(r);
    });
    return h;
  }
  /* ---------- kontroly ---------- */
  function kontrola_prekryvu(rozpis) {
    const s = smeny_serazene(rozpis), chyby = [];
    for (let i = 1; i < s.length; i++) {
      if (s[i].od < s[i - 1].do) {
        chyby.push(chyba('prekryv', s[i].r.datum,
          'Směna ' + s[i].r.datum + ' se překrývá se směnou ' + s[i - 1].r.datum + '.'));
      }
    }
    return chyby;
  }
  function kontrola_pauzy(rozpis, pauza_h) {
    const s = smeny_serazene(rozpis), chyby = [];
    for (let i = 1; i < s.length; i++) {
      const mezera = (s[i].od - s[i - 1].do) / HOD;
      if (mezera >= 0 && mezera < pauza_h) {
        chyby.push(chyba('pauza', s[i].r.datum,
          'Pauza před směnou ' + s[i].r.datum + ' je ' + mezera + ' h (min. ' + pauza_h + ' h).'));
      }
    }
    return chyby;
  }
  function kontrola_nocnich_po_sobe(rozpis, max) {
    const chyby = [];
    let serie = 0, posl = null;
    serazene(rozpis).forEach(function (r) {
      if (r.smena !== 'N') return;
      const d = dny(r.datum);
      serie = (posl !== null && d === posl + 1) ? serie + 1 : 1;
      posl = d;
      if (serie === max + 1) {
        chyby.push(chyba('nocni', r.datum,
          'Více než ' + max + ' noční po sobě (od ' + datum_z_dnu(d - max) + ').'));
      }
    });
    return chyby;
  }
  // V každém 7denním okně (od 00:00 prvního dne) musí být souvislé volno >= min_h.
  // Kontrolují se jen úplná okna uvnitř rozpisu (první den se vynechá kvůli noční z předchozího dne).
  function kontrola_volna(rozpis, min_h) {
    const chyby = [], r = serazene(rozpis);
    if (!r.length) return chyby;
    const prvni = dny(r[0].datum), posl = dny(r[r.length - 1].datum);
    const s = smeny_serazene(rozpis);
    for (let den = prvni + 1; den + 6 <= posl; den++) {
      const ws = den * DEN, we = (den + 7) * DEN;
      let kurzor = ws, nejdelsi = 0;
      for (let i = 0; i < s.length; i++) {
        if (s[i].do <= ws || s[i].od >= we) continue;
        nejdelsi = Math.max(nejdelsi, Math.max(s[i].od, ws) - kurzor);
        kurzor = Math.max(kurzor, Math.min(s[i].do, we));
      }
      nejdelsi = Math.max(nejdelsi, we - kurzor);
      if (nejdelsi / HOD < min_h) {
        chyby.push(chyba('volno', datum_z_dnu(den),
          'V týdnu od ' + datum_z_dnu(den) + ' je nejdelší souvislé volno ' + (nejdelsi / HOD) +
          ' h (min. ' + min_h + ' h).'));
      }
    }
    return chyby;
  }
  // Klouzavé okno o délce cyklu (14 dní): součet hodin nesmí překročit max_h.
  function kontrola_cyklu(rozpis, max_h, delka) {
    const chyby = [], r = serazene(rozpis);
    if (!r.length) return chyby;
    const L = delka || 14, h = {};
    r.forEach(function (x) {
      if (x.smena !== 'V') { const d = dny(x.datum); h[d] = (h[d] || 0) + trvani_h(x); }
    });
    const prvni = dny(r[0].datum), posl = dny(r[r.length - 1].datum);
    for (let a = prvni; a + L - 1 <= posl; a++) {
      let soucet = 0;
      for (let d = a; d < a + L; d++) soucet += h[d] || 0;
      if (soucet > max_h) {
        chyby.push(chyba('max_hodin_cyklus', datum_z_dnu(a),
          'Za ' + L + ' dní od ' + datum_z_dnu(a) + ' je ' + soucet + ' h (max. ' + max_h + ' h).'));
      }
    }
    return chyby;
  }
  function kontrola_vsech_pravidel(rozpis, nastaveni) {
    const p = nastaveni.pravidla;
    const chyby = [].concat(
      kontrola_prekryvu(rozpis),
      kontrola_pauzy(rozpis, p.pauza_h),
      kontrola_nocnich_po_sobe(rozpis, p.max_nocnich_po_sobe),
      kontrola_volna(rozpis, p.min_souvisle_volno_h),
      kontrola_cyklu(rozpis, p.max_hodin_cyklus, nastaveni.vzor.length)
    );
    return { ok: chyby.length === 0, chyby: chyby };
  }
  /* ---------- více lidí ---------- */
  // rozpisy_osob: { osoba_id: rozpis[] } → [{typ: "N"|"D", osoby: [osoba_id], text}], [] = bez konfliktu
  function konflikt_lidi(rozpisy_osob, datum) {
    const osoby = { D: [], N: [] };
    let n = 0;
    Object.keys(rozpisy_osob || {}).forEach(function (id) {
      const r = pole(rozpisy_osob[id]).filter(function (x) { return x.datum === datum; })[0];
      if (!r) return;
      n++;
      if (osoby[r.smena]) osoby[r.smena].push(id);
    });
    const nazev = { N: 'noční', D: 'denní' }, out = [];
    ['N', 'D'].forEach(function (k) {
      const o = osoby[k];
      if (o.length < 2) return;
      const text = o.length === n
        ? (n === 2 ? 'oba' : 'všichni') + ' mají ' + nazev[k]
        : o.length + ' z ' + n + ' mají ' + nazev[k];
      out.push({ typ: k, osoby: o, text: text });
    });
    return out;
  }
  // Návrh pokrytí jen tam, kde výjimka (např. dovolená) uvolnila vzorovou směnu
  // a nikdo jiný ji ten den nemá. Vzor se nemění, navrhují se pouze výjimky.
  // Návrh musí projít pravidly; jediná tolerovaná výjimka je překročení max_hodin_cyklus (varování).
  function doplň_rozpis(rozpisy_osob, nastaveni) {
    rozpisy_osob = rozpisy_osob || {};
    const ids = Object.keys(rozpisy_osob), navrhy = [], nelze = [];
    if (ids.length < 2) return { navrhy: navrhy, nelze: nelze };
    const klic = function (c) { return c.pravidlo + '|' + c.datum; };
    ids.forEach(function (id) {
      pole(rozpisy_osob[id]).forEach(function (r) {
        if (!(r.vyjimka && r.smena === 'V' && r.puvodni && r.puvodni !== 'V')) return;
        const kod = r.puvodni;
        const kryto = ids.some(function (j) {
          return j !== id && pole(rozpisy_osob[j]).some(function (x) { return x.datum === r.datum && x.smena === kod; });
        });
        if (kryto) return;
        let nejlepsi = null;
        ids.forEach(function (j) {
          if (j === id) return;
          const radky = pole(rozpisy_osob[j]);
          const idx = radky.findIndex(function (x) { return x.datum === r.datum; });
          if (idx < 0 || radky[idx].smena !== 'V') return;
          const zaklad = {};
          kontrola_vsech_pravidel(radky, nastaveni).chyby.forEach(function (c) { zaklad[klic(c)] = 1; });
          const upraveny = radky.slice();
          upraveny[idx] = radek(r.datum, kod, nastaveni, { poznamka: 'návrh: převzetí směny' }, 'V');
          const nove = kontrola_vsech_pravidel(upraveny, nastaveni).chyby.filter(function (c) { return !zaklad[klic(c)]; });
          if (nove.some(function (c) { return c.pravidlo !== 'max_hodin_cyklus'; })) return;
          const varovani = nove.length ? ['max_hodin_cyklus'] : [];
          if (!nejlepsi || (nejlepsi.varovani.length && !varovani.length)) {
            nejlepsi = { datum: r.datum, smena: kod, osoba_id: j, od: upraveny[idx].od, do: upraveny[idx].do, varovani: varovani };
          }
        });
        if (nejlepsi) navrhy.push(nejlepsi);
        else nelze.push({ datum: r.datum, smena: kod, duvod: 'nikdo nemůže směnu převzít' });
      });
    });
    return { navrhy: navrhy, nelze: nelze };
  }
  const API = {
    NASTAVENI_VYCHOZI: NASTAVENI_VYCHOZI,
    smena_pro_den: smena_pro_den,
    generuj_rozpis: generuj_rozpis,

    F.getDoc(F.doc(db,'tymy',kod)).then(d=>{const n=d.exists()&&String(d.data().nazev||'').slice(0,40);if(n&&S.tym&&S.tym.kod===kod&&n!==S.tym.nazev){S.tym.nazev=n;uloz();render(true)}}).catch(()=>{});
    publikuj();
  }catch(e){}
}
function profil(){
  const ja=S.lide[0],od=fd(dnes()-62),pozn=S.tym.poznamky!==false;
  return{jmeno:String(ja.jmeno).slice(0,40),barva:HEX.test(ja.barva)?ja.barva:'#0f766e',role:String(ja.role||'').slice(0,40),posun_dnu:Math.trunc(+ja.posun_dnu||0),
    nastaveni:{datum_zacatku_cyklu:S.nastaveni.datum_zacatku_cyklu,vzor:S.nastaveni.vzor,smeny:{D:{od:S.nastaveni.smeny.D.od,do:S.nastaveni.smeny.D.do},N:{od:S.nastaveni.smeny.N.od,do:S.nastaveni.smeny.N.do}},pravidla:S.nastaveni.pravidla},
    zasahy:S.zasahy.filter(z=>z.osoba_id===ja.id&&z.datum>=od).slice(-400).map(z=>({datum:z.datum,smena:z.smena,poznamka:pozn?String(z.poznamka||'').slice(0,200):'',zmeneno:+z.zmeneno||0}))};
}
let pubT=null;
function naplanujPublikaci(){if(S.tym&&SY.uid){clearTimeout(pubT);pubT=setTimeout(publikuj,600)}}
async function publikuj(){
  if(!S.tym||!SY.uid)return;
  const p=profil(),j=JSON.stringify(p),kod=S.tym.kod;
  if(j===S.tym.posledni)return;
  try{await SY.F.setDoc(SY.F.doc(SY.db,'tymy',kod,'clenove',SY.uid),Object.assign({},p,{upraveno:Date.now()}));if(S.tym&&S.tym.kod===kod){S.tym.posledni=j;uloz()}}
  catch(e){nastavStav('chyba',hlaska(e))}
}
const ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',BARVY=['#e11d48','#7c3aed','#2563eb','#0891b2','#059669','#ca8a04','#ea580c','#db2777'];
function novyKod(){const a=new Uint8Array(8);crypto.getRandomValues(a);return Array.from(a,x=>ABC[x&31]).join('')}
const normKod=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function odpojTym(){if(SY.unsub){SY.unsub();SY.unsub=null}SY.posl='';SY.mel=false;T.clenove={};try{localStorage.removeItem(TKEY)}catch(e){}}
async function vstupDoTymu(kod,nazev,jmeno,novy){
  const{F,db,uid}=await fbInit();
  const ref=F.doc(db,'tymy',kod);
  if(novy)await F.setDoc(ref,{nazev,zalozeno:Date.now()});
  else{const d=await F.getDoc(ref);if(!d.exists())throw new Error('Tým s tímto kódem neexistuje.');nazev=String(d.data().nazev||'Tým').slice(0,40)}
  if(S.tym&&S.tym.kod!==kod){F.deleteDoc(F.doc(db,'tymy',S.tym.kod,'clenove',uid)).catch(()=>{})}
  odpojTym();
  S.lide[0].jmeno=jmeno;
  /* ať v týmu nemají všichni výchozí zelenou */
  if(S.lide[0].barva==='#0f766e')S.lide[0].barva=BARVY[uid.charCodeAt(0)%BARVY.length];
  S.tym={kod,nazev,poznamky:true,videno:Date.now(),posledni:''};
  SY.videnoPri=Date.now();
  uloz();await pripojTym();
}
function opustTym(){
  if(!confirm(`Opustit tým „${S.tym.nazev}“? Kolegové přestanou vidět tvoje směny.`))return;
  if(SY.uid)SY.F.deleteDoc(SY.F.doc(SY.db,'tymy',S.tym.kod,'clenove',SY.uid)).catch(()=>{});
  odpojTym();S.tym=null;nastavStav('vypnuto');

}
function pozvanka(){const u=new URL(location.pathname,location.origin);u.searchParams.set('tym',S.tym.kod);if(!window.SMENOVNIK_FIREBASE&&S.fb)u.searchParams.set('fb',btoa(unescape(encodeURIComponent(JSON.stringify(S.fb)))));return u.toString()}
async function sdilej(){

  try{await navigator.clipboard.writeText(text+' '+url);toast('Pozvánka zkopírována – pošli ji kolegům')}catch(e){prompt('Zkopíruj pozvánku:',url)}

/* pozvánka v adrese: ?tym=KOD (&fb=nastavení Firebase, když není ve firebase-config.js) */

  const fb=p.get('fb');

function nactiTymCache(){try{const c=JSON.parse(localStorage.getItem(TKEY)||'null');if(c&&S.tym&&c.kod===S.tym.kod&&c.clenove){const m={};Object.values(c.clenove).forEach(x=>{const v=prijmi(String(x.id).slice(2),x);if(v)m[v.id]=v});T.clenove=m;SY.posl=JSON.stringify(m)}}catch(e){}}

/* ---------- úprava dne ---------- */
const RYCHLE=['Dovolená','Nemoc','Výměna','Školení','Přesčas'],VOLNO=['Dovolená','Nemoc'];
let edit=null,predFokus=null,detailOs=null;
function otevri(datum,id){
  const os=id||S.ui.osoba,n=pd(datum),s=rozpisUI(os,n,n)[0],o=osoba(os);
  if(!o)return;
  predFokus=document.activeElement;
  if(jeRem(os)){
    edit=null;detailOs=os;
    const z=o.zasahy.find(x=>x.datum===datum),k=s?s.kod:null;
    $('#sheet').innerHTML=`<div class="grab"></div><div class="sh-h"><div><h2 id="shT">${dnyN(n)} ${dm(n)}</h2><div class="hint">${esc(o.jmeno)}${o.role?' · '+esc(o.role):''}</div></div><button class="ib" data-x="close" aria-label="Zavřít">${ic('x')}</button></div>
<div class="detail" style="${k?sv(k):''}">${k?pill(k,'big'):''}<div><div class="nm">${k?esc(nazevSmeny(k)):'Před začátkem cyklu'}</div>${s&&k!=='V'?`<div class="tm">${esc(s.od)} – ${esc(s.do)}${s.presahne?' (+1 den)':''}</div>`:''}</div></div>
${s&&s.vyjimka?`<p class="hint">Upraveno${z&&z.zmeneno?' '+pred(z.zmeneno):''}${s.puvodni?` · podle vzoru ${esc(nazevSmeny(s.puvodni))}`:''}</p>`:''}${s&&s.poznamka?`<p>✎ ${esc(s.poznamka)}</p>`:''}
<button class="btn w" style="margin-top:12px" data-x="kal">${ic('cal')}Kalendář – ${esc(o.jmeno)}</button>`;
    $('#ov').classList.add('on');$('#sheet [data-x=close]').focus({preventScroll:true});
    return;
  }
  const z=S.zasahy.find(x=>x.datum===datum&&x.osoba_id===os);
  const vz=n>=zacatekOsoby(os)?Smenovnik.smena_pro_den(datum,S.nastaveni,posunOsoby(os),[]):null;
  edit={datum,os,kod:s?s.kod:'V',vz};
  $('#sheet').innerHTML=`<div class="grab"></div><div class="sh-h"><div><h2 id="shT">${dnyN(n)} ${dm(n)}</h2><div class="hint">${esc(o.jmeno)}${vz?` · podle vzoru ${esc(nazevSmeny(vz))}`:''}</div></div><button class="ib" data-x="close" aria-label="Zavřít">${ic('x')}</button></div>
<div class="volba" role="radiogroup" aria-label="Směna">${['V','D','N'].map(k=>`<button data-k="${k}" role="radio" aria-checked="${k===edit.kod}" class="${k===edit.kod?'on':''}" style="${sv(k)}">${pill(k)}<span class="vn">${esc(nazevSmeny(k))}</span><span class="vt">${k==='V'?'bez směny':esc(S.nastaveni.smeny[k].od)+'–'+esc(S.nastaveni.smeny[k].do)}</span></button>`).join('')}</div>
<label class="l" for="pozn">Poznámka${S.tym&&os===S.lide[0].id&&S.tym.poznamky!==false?' (uvidí ji tým)':''}</label><div class="q">${RYCHLE.map(q=>`<button data-q="${q}">${q}</button>`).join('')}</div><textarea id="pozn" placeholder="Např. výměna s kolegou">${esc(z?z.poznamka:'')}</textarea>
<div class="row" style="margin-top:14px">${z?'<button class="btn d" data-x="reset">Podle vzoru</button>':''}<button class="btn p" data-x="save">Uložit</button></div>`;
  $('#ov').classList.add('on');
  const on=$('#sheet .volba button.on');if(on)on.focus({preventScroll:true});
}
function zavri(){$('#ov').classList.remove('on');edit=null;if(predFokus&&predFokus.isConnected)predFokus.focus({preventScroll:true});predFokus=null}
function vyber(k){edit.kod=k;document.querySelectorAll('.volba button').forEach(x=>{const on=x.dataset.k===k;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)})}
$('#ov').addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='ov')return zavri();
  const b=t.closest('.volba button');if(b&&edit)return vyber(b.dataset.k);
  const q=t.closest('[data-q]');
  if(q&&edit){const p=$('#pozn'),v=p.value.trim(),r=q.dataset.q;p.value=!v||RYCHLE.includes(v)?r:v+', '+r;if(VOLNO.includes(r))vyber('V');return}
  const x=t.closest('[data-x]');if(!x)return;
  if(x.dataset.x==='close')return zavri();
  if(x.dataset.x==='kal'){if(detailOs)S.ui.osoba=detailOs;S.ui.tab='kal';anim=true;zavri();uloz();render();scrollTo(0,0);return}
  if(!edit)return;
  const ost=S.zasahy.filter(z=>!(z.datum===edit.datum&&z.osoba_id===edit.os));
  if(x.dataset.x==='save'){
    const pozn=$('#pozn').value.trim();
    S.zasahy=edit.kod===edit.vz&&!pozn?ost:ost.concat({datum:edit.datum,osoba_id:edit.os,smena:edit.kod,poznamka:pozn,zmeneno:Date.now()});
    toast(S.tym&&edit.os===S.lide[0].id?'Uloženo · tým uvidí změnu':'Uloženo');
  }
  if(x.dataset.x==='reset'){S.zasahy=ost;toast('Vráceno podle vzoru')}
  zavri();uloz();render(true);
});

/* ---------- události ---------- */
document.querySelector('nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t==='tym'&&S.tym&&S.ui.tab!=='tym'){SY.videnoPri=S.tym.videno||0;S.tym.videno=Date.now()}

$('#prehled').addEventListener('click',e=>{

$('#tym').addEventListener('click',async e=>{
  const t=e.target.closest('[data-a],[data-td],[data-os]');if(!t)return;
  if(t.dataset.td)return otevri(t.dataset.td,t.dataset.tp);
  if(t.dataset.os){S.ui.osoba=t.dataset.os;S.ui.tab='tyden';anim=true;uloz();render();scrollTo(0,0);return}
  const a=t.dataset.a;
  if(a==='cfg'){const c=parseCfg($('#fbcfg').value);if(!c)return toast('Tohle nevypadá jako firebaseConfig');S.fb=c;SY.start=null;uloz();render(true);return toast('Firebase je nastavené ✓')}
  if(a==='zaloz'||a==='pripoj'){
    const jm=$('#t-jm').value.trim().slice(0,40);
    if(!jm){$('#t-jm').focus();return toast('Napiš své jméno')}

    else{kod=normKod($('#t-kod').value);if(!/^[A-Z2-9]{8}$/.test(kod)){$('#t-kod').focus();return toast('Kód má 8 znaků, např. ABCD-EF23')}}
    const puv=t.textContent;t.disabled=true;t.textContent='Připojuji…';
    try{await vstupDoTymu(kod,nazev,jm,a==='zaloz');pozvanyKod='';anim=true;render();toast(a==='zaloz'?'Tým je založený 🎉 Pozvi kolegy':`Vítej v týmu ${S.tym.nazev} 🎉`)}
    catch(err){t.disabled=false;t.textContent=puv;toast(hlaska(err))}

});
$('#tym').addEventListener('change',e=>{if(e.target.dataset.a==='pozn'&&S.tym){S.tym.poznamky=e.target.checked;uloz()}});
/* tah prstem doleva/doprava = další/předchozí týden či měsíc */
let tx=null,ty=0;
$('#prehled').addEventListener('touchstart',e=>{tx=e.target.closest('.swipe')?e.touches[0].clientX:null;ty=e.touches[0].clientY},{passive:true});
$('#prehled').addEventListener('touchend',e=>{
  if(tx===null)return;const p=e.changedTouches[0],dx=p.clientX-tx,dy=p.clientY-ty,k=e.target.closest('#kal')?'mesic':'tyden';tx=null;

function jeVse(o){return o&&o.nastaveni&&Array.isArray(o.nastaveni.vzor)&&o.nastaveni.vzor.length===14&&o.nastaveni.vzor.every(k=>'VDN'.includes(k))&&o.nastaveni.smeny&&o.nastaveni.smeny.D&&o.nastaveni.smeny.N&&Array.isArray(o.lide)&&o.lide.length&&/^\d{4}-\d\d-\d\d$/.test(o.nastaveni.datum_zacatku_cyklu)}
function importuj(text){
  try{const o=JSON.parse(text);if(!jeVse(o))throw 0;S.nastaveni=o.nastaveni;S.lide=o.lide;S.zasahy=Array.isArray(o.zasahy)?o.zasahy:[];if(!osoba(S.ui.osoba))S.ui.osoba=S.lide[0].id}

}
const zalohaJSON=()=>JSON.stringify(data(),null,1);
$('#nast').addEventListener('click',e=>{

  if(a==='cell'){const v=S.nastaveni.vzor;v[i]={V:'D',D:'N',N:'V'}[v[i]]}
  else if(a==='osadd'){S.lide.push({id:'o'+Date.now().toString(36),jmeno:'Nová osoba',role:'',barva:'#be185d',posun_dnu:0})}
  else if(a==='osdel'){const l=S.lide[i];if(!confirm('Odebrat osobu '+l.jmeno+' včetně jejích úprav?'))return;S.lide.splice(i,1);S.zasahy=S.zasahy.filter(z=>z.osoba_id!==l.id);if(S.ui.osoba===l.id)S.ui.osoba=S.lide[0].id}
  else if(a==='tema')S.ui.tema=t.dataset.v;
  else if(a==='zt')S.ui.zacatek_tydne=+t.dataset.v;
  else if(a==='export'){
    const j=zalohaJSON();$('#zaloha').value=j;
    try{const u=URL.createObjectURL(new Blob([j],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download=`smenovnik-zaloha-${fd(dnes())}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Záloha stažena')}

  else if(a==='import')return importuj($('#zaloha').value);
  else if(a==='fbreset'){if(S.tym)return toast('Nejdřív opusť tým');S.fb=null;SY.start=null;toast('Propojení zrušeno')}
  else if(a==='reset'){if(!confirm('Smazat všechna data a obnovit výchozí?'))return;const u=S.ui,tym=S.tym,fb=S.fb;S=vychozi();S.ui.tema=u.tema;S.ui.tab='nast';S.tym=tym;S.fb=fb;if(tym)tym.posledni='';toast('Obnoveno')}
  else return;
