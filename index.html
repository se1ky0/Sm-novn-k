<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Směnovník</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Směnovník">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#f2f4f7;--card:#fff;--card2:#f6f8fa;--ink:#101c26;--mut:#5c6b78;--line:#e1e6eb;--acc:#0f766e;--acci:#fff;--accs:#d3eeea;--v:#94a3b1;--warn:#b45309;--warnbg:#fef3c7;--err:#b91c1c;--errbg:#fee2e2;--kon:#6d28d9;--konbg:#ede9fe;--tint:12%;--tint2:22%;--glow1:rgba(20,184,166,.22);--glow2:rgba(245,158,11,.18);--glow3:rgba(99,102,241,.14);--sh:0 1px 2px rgba(16,28,38,.05),0 8px 22px -10px rgba(16,28,38,.18);--ov:rgba(10,20,28,.45);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1117;--card:#151e27;--card2:#1b2631;--ink:#e9eff4;--mut:#94a4b2;--line:#26333f;--acc:#2dd4bf;--acci:#04221e;--accs:#143d38;--v:#6b7a88;--warn:#fcd34d;--warnbg:#3b2f0b;--err:#fca5a5;--errbg:#451a1a;--kon:#c4b5fd;--konbg:#2e2150;--tint:16%;--tint2:30%;--glow1:rgba(45,212,191,.16);--glow2:rgba(245,158,11,.10);--glow3:rgba(129,140,248,.14);--sh:none;--ov:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1117;--card:#151e27;--card2:#1b2631;--ink:#e9eff4;--mut:#94a4b2;--line:#26333f;--acc:#2dd4bf;--acci:#04221e;--accs:#143d38;--v:#6b7a88;--warn:#fcd34d;--warnbg:#3b2f0b;--err:#fca5a5;--errbg:#451a1a;--kon:#c4b5fd;--konbg:#2e2150;--tint:16%;--tint2:30%;--glow1:rgba(45,212,191,.16);--glow2:rgba(245,158,11,.10);--glow3:rgba(129,140,248,.14);--sh:none;--ov:rgba(0,0,0,.6);color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding:16px 0 calc(90px + env(safe-area-inset-bottom,0px))}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
/* barevná záře v pozadí horní části */
body:before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:520px;pointer-events:none;background:radial-gradient(60% 70% at 0% 0%,var(--glow1),transparent 70%),radial-gradient(50% 60% at 100% 5%,var(--glow2),transparent 70%),radial-gradient(40% 50% at 60% 40%,var(--glow3),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
h1,h2,h3{margin:0;letter-spacing:-.015em}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mut{color:var(--mut)}
/* ---------- hlavička a navigace ---------- */
.top{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 6px}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:44px;height:44px;border-radius:14px;flex:none;box-shadow:0 6px 16px -6px rgba(15,118,110,.6)}
h1{font-size:21px;line-height:1.15}
.sub{font-size:14px;color:var(--mut)}
main{max-width:1100px;margin:0 auto;padding:4px 16px calc(108px + env(safe-area-inset-bottom,0px))}
.v{display:none}
body[data-t=tyden] #tyden,body[data-t=kal] #kal,body[data-t=tym] #tym,body[data-t=nast] #nast{display:block}
section>h2{font-size:24px;margin:10px 0 12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-top:1px solid var(--line)}
nav.tabs button{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border:0;background:none;color:var(--mut);font-size:12px;font-weight:650}
nav.tabs .pi{position:relative;display:grid;place-items:center;width:58px;height:32px;border-radius:16px;transition:background .25s,color .25s}
body[data-t=tyden] nav [data-t=tyden],body[data-t=kal] nav [data-t=kal],body[data-t=tym] nav [data-t=tym],body[data-t=nast] nav [data-t=nast]{color:var(--ink)}
body[data-t=tyden] nav [data-t=tyden] .pi,body[data-t=kal] nav [data-t=kal] .pi,body[data-t=tym] nav [data-t=tym] .pi,body[data-t=nast] nav [data-t=nast] .pi{background:var(--acc);color:var(--acci)}
nav .ld{display:none}
.badge{position:absolute;top:-4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--card)}
.badge:empty{display:none}
/* ---------- lidé ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;min-height:42px;padding:0 15px 0 6px;border-radius:21px;border:1px solid var(--line);background:var(--card);font-weight:650;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.rem .av{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--c)}
.av{width:30px;height:30px;border-radius:50%;flex:none;background:var(--c);color:var(--ci);display:grid;place-items:center;font-size:13px;font-weight:800;position:relative}
.av .live{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px var(--card)}
/* ---------- karta "teď / další směna" ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;margin-bottom:18px;color:var(--bi,#fff);background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--bc) 55%,#fff) 0,transparent 60%),linear-gradient(140deg,color-mix(in srgb,var(--bc) 80%,#fff),var(--bc));box-shadow:0 14px 34px -14px color-mix(in srgb,var(--bc) 75%,transparent)}
.hero.klid{color:var(--ink);background:var(--card);box-shadow:var(--sh);border:1px solid var(--line)}
.hero .eyebrow{color:inherit;opacity:.78}
.eyebrow{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.hero-main{position:relative;display:flex;align-items:center;gap:14px;margin:10px 0 14px}
.hero-t{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.hero-s{font-size:16px;opacity:.82;font-variant-numeric:tabular-nums;font-weight:550}
.hero .pill.big{background:color-mix(in srgb,var(--bi,#fff) 18%,transparent);color:inherit;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bi,#fff) 30%,transparent)}
.stat{position:relative;display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.dot.live{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.bar{position:relative;height:8px;border-radius:4px;background:color-mix(in srgb,currentColor 20%,transparent);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;border-radius:4px}
.hero .note{color:inherit;opacity:.85}
.deco{position:absolute;right:-44px;top:-44px;width:170px;height:170px;pointer-events:none;opacity:.22;fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round}
.deco .rays{transform-origin:85px 85px;animation:spin 50s linear infinite}
.deco .fill{fill:currentColor;stroke:none}
.deco .star{fill:currentColor;stroke:none;animation:twinkle 3s ease-in-out infinite}
.deco .star:nth-of-type(2){animation-delay:1s}.deco .star:nth-of-type(3){animation-delay:2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{50%{opacity:.25}}
.pill{display:inline-grid;place-items:center;flex:none;min-width:38px;height:38px;padding:0 8px;border-radius:12px;background:var(--bc);color:var(--bi,#fff);font-weight:800;font-size:17px}
.pill.big{min-width:62px;height:62px;border-radius:19px;font-size:29px}
.pill.vol{background:transparent;color:var(--mut);box-shadow:inset 0 0 0 2px var(--line)}
/* ---------- týden ---------- */
.wnav{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.wnav .t{flex:1;text-align:center;min-width:0}
.wnav .t b{display:block;font-size:17px}
.wnav .t small{display:block;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.ib{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0;box-shadow:var(--sh)}
.zpet{border:0;background:var(--acc);color:var(--acci);font-weight:750;font-size:12px;border-radius:10px;padding:2px 9px;margin-left:6px;vertical-align:1px}
.list{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 12px 12px 10px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);position:relative;overflow:hidden}
.drow.s{background:linear-gradient(90deg,color-mix(in srgb,var(--bc) var(--tint2),var(--card)),color-mix(in srgb,var(--bc) var(--tint),var(--card)));border-color:color-mix(in srgb,var(--bc) 28%,var(--line))}
.drow.s:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bc)}
.drow.past{opacity:.5}
.drow.dnes{outline:2.5px solid var(--acc);outline-offset:2px}
.dcol{width:44px;flex:none;text-align:center;line-height:1.1}
.dw{display:block;font-size:12px;font-weight:750;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.dn{display:block;font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.dnes .dw,.dnes .dn{color:var(--acc)}
.mid{flex:1;min-width:0}
.nm{display:block;font-weight:750;font-size:17px}
.tm{display:block;color:var(--mut);font-size:15px;font-variant-numeric:tabular-nums}
.note{display:block;font-size:14px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;vertical-align:2px;margin-left:7px;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:750;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.up{display:block;margin-top:6px;padding:5px 9px;border-radius:9px;font-size:13px;font-weight:650}
.up.chyba{background:var(--errbg);color:var(--err)}.up.varovani{background:var(--warnbg);color:var(--warn)}.up.konflikt{background:var(--konbg);color:var(--kon)}
.anim .hero,.anim .tymh,.anim .list>*,.anim .cal>*,.anim .tgrid>*,.anim .fi,.anim .nowc{animation:rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* ---------- kalendář ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-h{font-size:12px;font-weight:750;color:var(--mut);text-align:center;padding:0 0 3px;text-transform:uppercase;letter-spacing:.04em}
.cc{position:relative;min-width:0;aspect-ratio:1/1.08;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:13px;border:1px solid var(--line);background:var(--card);padding:2px}
.cc.s{background:color-mix(in srgb,var(--bc) var(--tint2),var(--card));border-color:color-mix(in srgb,var(--bc) 30%,transparent)}
.cn{font-size:12px;font-weight:650;color:var(--mut);font-variant-numeric:tabular-nums}
.ck{font-size:19px;font-weight:800;line-height:1;color:color-mix(in srgb,var(--bc) 78%,var(--ink))}
.cc.v .ck{font-size:13px;font-weight:600;color:var(--v)}
.ct{display:none;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.cc.out{opacity:.35}
.cc.dnes{background:var(--acc);border-color:var(--acc)}
.cc.dnes .cn,.cc.dnes .ck,.cc.dnes .ct{color:var(--acci)}
.cc.vyj{border:1.5px dashed color-mix(in srgb,var(--bc) 65%,var(--ink))}
.wd{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%}
.wd.chyba{background:var(--err)}.wd.varovani{background:var(--warn)}.wd.konflikt{background:var(--kon)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 2px 4px;font-size:13px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;background:color-mix(in srgb,var(--bc) var(--tint2),var(--card));border:1px solid color-mix(in srgb,var(--bc) 45%,transparent)}
.sw.d{background:none;border:1.5px dashed var(--mut)}
.sw.o{border-radius:50%;width:8px;height:8px;background:var(--warn);border:0}
.sw.a{border-radius:50%;width:8px;height:8px;background:#0891b2;border:0}
/* ---------- akce ---------- */
.achs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ach{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 9px;border-radius:9px;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--ac) 15%,var(--card));color:color-mix(in srgb,var(--ac) 72%,var(--ink));border:1px solid color-mix(in srgb,var(--ac) 32%,transparent)}
.rs{display:inline-grid;place-items:center;flex:none;width:17px;height:17px;border-radius:50%;font-size:11px;font-weight:800;color:#fff}
.rs.ano{background:#16a34a}.rs.ne{background:#dc2626}.rs.mozna{background:#ca8a04}.rs.ceka{box-shadow:inset 0 0 0 1.5px currentColor}
.ad{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 1.5px var(--card)}
.tc.ak:before{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:currentColor}
.sec{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:18px 0 8px}
.ait{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:16px;border:1px solid color-mix(in srgb,var(--ac) 28%,var(--line));background:color-mix(in srgb,var(--ac) 7%,var(--card));margin-bottom:8px}
.aic{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--ac) 22%,var(--card));font-size:21px}
.ait b{display:block;font-size:15px}
.ait small{display:block;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.sum{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.sum>span{font-size:12px;font-weight:750;padding:1px 8px;border-radius:7px}
.sum .ano{background:color-mix(in srgb,#16a34a 16%,var(--card));color:color-mix(in srgb,#16a34a 80%,var(--ink))}
.sum .mozna{background:color-mix(in srgb,#ca8a04 18%,var(--card));color:color-mix(in srgb,#ca8a04 80%,var(--ink))}
.sum .ne{background:color-mix(in srgb,#dc2626 15%,var(--card));color:color-mix(in srgb,#dc2626 80%,var(--ink))}
.sum .ceka{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--mut)}
.card.pend{border-color:color-mix(in srgb,#0891b2 40%,var(--line));background:color-mix(in srgb,#0891b2 6%,var(--card))}
.card.pend h3{margin-bottom:10px}
.typy{display:flex;flex-wrap:wrap;gap:6px}
.typy button{border:2px solid color-mix(in srgb,var(--ac) 30%,var(--line));background:color-mix(in srgb,var(--ac) 8%,var(--card));border-radius:14px;padding:7px 12px;font-weight:700;font-size:14px}
.typy button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 20%,var(--card));box-shadow:0 6px 14px -10px var(--ac)}
.komu{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.komu button{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card2);border-radius:18px;padding:3px 11px 3px 3px;font-weight:650;font-size:14px}
.komu button.on{border-color:var(--acc);background:var(--accs)}
.komu .av{width:26px;height:26px;font-size:10px}
.komu .vse{padding:6px 13px}
.rsvp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:2px 0 10px}
.rsvp button{min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--card2);font-weight:750;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rsvp button i{font-style:normal;font-size:19px;line-height:1}
.rsvp button.on{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 16%,var(--card));color:color-mix(in srgb,var(--rc) 82%,var(--ink));box-shadow:0 8px 18px -12px var(--rc)}
.odp{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.odp:first-of-type{border-top:0}
.odp .av{width:34px;height:34px}
.odp .oi{flex:1;min-width:0}
.odp .ost{font-size:13px;font-weight:800;color:var(--rc);white-space:nowrap}
.ahero{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--ac) var(--tint2),var(--card));margin:14px 0 6px}
.ahero .aic{width:58px;height:58px;font-size:29px;border-radius:17px;background:color-mix(in srgb,var(--ac) 30%,var(--card))}
.ahero b{font-size:18px}
.link{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--acc);font-weight:750;padding:6px 0;font-size:14px}
.link .ic{width:16px;height:16px}
.casrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:15px;color:var(--mut)}
.casrow b{color:var(--ink);font-variant-numeric:tabular-nums}
.sh-back{display:flex;align-items:center;gap:10px;min-width:0}
.role{display:inline-block;margin:4px 0 6px;font-size:12px;font-weight:800;letter-spacing:.03em;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,.22)}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0;margin-top:6px}
.mrow .nm{flex:1;font-size:15px;font-weight:400}
.tag.m{background:var(--accs);color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.st .si{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--bc);color:var(--bi);margin-bottom:8px}
.st .si .ic{width:18px;height:18px}
.st b{display:block;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.st span{font-size:13px;color:var(--mut)}
/* ---------- tým ---------- */
.tymh{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 16px;margin-bottom:16px;color:#fff;background:radial-gradient(100% 120% at 100% 0%,rgba(255,255,255,.25),transparent 55%),linear-gradient(135deg,#0f766e,#0e7490 55%,#4f46e5);box-shadow:0 14px 34px -16px rgba(14,116,144,.8)}
.tymh h3{font-size:24px;font-weight:800}
.tymh .row{align-items:center;margin-top:12px}
.kod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;background:rgba(255,255,255,.18);padding:6px 10px;border-radius:10px;font-weight:700;font-size:15px;flex:none!important}
.tymh .btn{background:#fff;color:#0f766e;border:0}
.stav{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;opacity:.92}

<script>
/* Směnovník – logika rozpisu. Čistý JS, bez UI a knihoven.
 * Použití v HTML: vložit jako skript → window.Smenovnik.*; v Node module.exports.
 * Datum "YYYY-MM-DD", čas "HH:MM" (24 h), týden začíná pondělím.
 * Všechny časy se počítají nominálně (UTC aritmetika), změna letního času se ignoruje:
 * noční směna má vždy 12 h. Směna s "do" <= "od" končí následující den a počítá
 * se do dne začátku. */
(function () {
  'use strict';
  const DEN = 86400000, HOD = 3600000;
  const NASTAVENI_VYCHOZI = {
    datum_zacatku_cyklu: '2026-01-05',
    // krátký/dlouhý týden, 12h směny, 28 dní (druhá polovina = první s prohozenou D/N)
    vzor: ['V','V','N','N','V','V','V','D','D','V','V','N','N','N','V','V','D','D','V','V','V','N','N','V','V','D','D','D'],
    smeny: { D: { od: '06:00', do: '18:00' }, N: { od: '18:00', do: '06:00' } },
    pravidla: { pauza_h: 11, max_hodin_cyklus: 168, max_nocnich_po_sobe: 3, min_souvisle_volno_h: 35 }
  };
  /* ---------- pomocné ---------- */
  function mod(a, n) { return ((a % n) + n) % n; }
  function dny(datum) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(datum)) throw new Error('Neplatné datum: ' + datum);
    const p = datum.split('-');
    const n = Date.UTC(+p[0], +p[1] - 1, +p[2]) / DEN;
    if (datum_z_dnu(n) !== datum) throw new Error('Neplatné datum: ' + datum);
    return n;
  }
  function datum_z_dnu(n) { return new Date(n * DEN).toISOString().slice(0, 10); }
  function cas_ms(datum, hhmm) {
    const p = datum.split('-'), c = hhmm.split(':');
    return Date.UTC(+p[0], +p[1] - 1, +p[2], +c[0], +c[1]);
  }
  function iso(ms) { return new Date(ms).toISOString().slice(0, 16); } // YYYY-MM-DDTHH:MM
  function ms_z_iso(s) { const d = s.split('T'); return cas_ms(d[0], d[1]); }
  function trvani_h(r) { return (ms_z_iso(r.do) - ms_z_iso(r.od)) / HOD; }
  const UROVEN = { prekryv: 'chyba', pauza: 'chyba', volno: 'chyba', nocni: 'varovani', max_hodin_cyklus: 'varovani' };
  function chyba(pravidlo, datum, zprava) {
    return { pravidlo: pravidlo, uroven: UROVEN[pravidlo] || 'chyba', datum: datum, zprava: zprava };
  }
  function pole(x) { return Array.isArray(x) ? x : []; }
  function serazene(rozpis) {
    return pole(rozpis).slice().sort(function (a, b) { return dny(a.datum) - dny(b.datum); });
  }
  function smeny_serazene(rozpis) {
    return pole(rozpis).filter(function (r) { return r.smena !== 'V' && r.od; })
      .map(function (r) { return { r: r, od: ms_z_iso(r.od), do: ms_z_iso(r.do) }; })
      .sort(function (a, b) { return a.od - b.od; });
  }
  function najdi_vyjimku(datum, vyjimky) {
    if (!vyjimky) return null;
    for (let i = 0; i < vyjimky.length; i++) if (vyjimky[i].datum === datum) return vyjimky[i];
    return null;
  }
  function vzor_smena(datum, nastaveni, posun) {
    const vz = nastaveni.vzor;
    // posun_dnu: vzor osoby začíná o posun dnů později než základní cyklus
    const i = mod(dny(datum) - dny(nastaveni.datum_zacatku_cyklu) - (posun || 0), vz.length);
    return vz[i];
  }
  function radek(datum, kod, nastaveni, vyj, puvodni) {
    const r = { datum: datum, smena: kod, od: null, do: null, vyjimka: false };
    if (kod !== 'V') {
      // výjimka může mít vlastní čas směny (např. zkrácená směna)
      const vlastni = vyj && /^\d\d:\d\d$/.test(vyj.od || '') && /^\d\d:\d\d$/.test(vyj.do || '');
      const s = vlastni ? vyj : nastaveni.smeny[kod];
      const od = cas_ms(datum, s.od);
      let konec = cas_ms(datum, s.do);
      if (konec <= od) konec += DEN; // přes půlnoc → další den
      r.od = iso(od); r.do = iso(konec);
    }
    if (vyj) { r.vyjimka = true; r.poznamka = vyj.poznamka || ''; r.puvodni = puvodni; }
    return r;
  }
  /* ---------- rozpis ---------- */
  // vyjimky (nepovinné): pole {datum, smena: V|D|N, poznamka, od?, do?} pro danou osobu
  function smena_pro_den(datum, nastaveni, posun, vyjimky) {
    const v = najdi_vyjimku(datum, vyjimky);
    if (v) {
      if (['V', 'D', 'N'].indexOf(v.smena) < 0) throw new Error('Neplatná směna ve výjimce: ' + v.smena);
      return v.smena;
    }
    return vzor_smena(datum, nastaveni, posun);
  }
  function generuj_rozpis(od, do_, nastaveni, posun, vyjimky) {
    const a = dny(od), b = dny(do_), out = [];
    for (let n = a; n <= b; n++) {
      const d = datum_z_dnu(n);
      const v = najdi_vyjimku(d, vyjimky);
      const kod = smena_pro_den(d, nastaveni, posun, vyjimky);
      out.push(radek(d, kod, nastaveni, v, v ? vzor_smena(d, nastaveni, posun) : null));
    }
    return out;
  }
  /* ---------- hodiny ---------- */
  // Okno začíná v libovolný den (datum_od) a trvá delka_dni (výchozí 7; 14 = cyklus).
  function hodiny_za_tyden(rozpis, datum_od, delka_dni) {
    const a = dny(datum_od), b = a + (delka_dni || 7) - 1;
    let smeny = 0, hodiny = 0;
    pole(rozpis).forEach(function (r) {
      if (r.smena === 'V') return;
      const d = dny(r.datum);
      if (d >= a && d <= b) { smeny++; hodiny += trvani_h(r); }
    });
    return { smeny: smeny, hodiny: hodiny };
  }
  function hodiny_za_cyklus(rozpis, datum_zacatku, delka) {
    const a = dny(datum_zacatku), b = a + (delka || 14) - 1;
    let h = 0;
    pole(rozpis).forEach(function (r) {
      if (r.smena === 'V') return;
      const d = dny(r.datum);
      if (d >= a && d <= b) h += trvani_h(r);
    });
    return h;
  }
  /* ---------- kontroly ---------- */
  function kontrola_prekryvu(rozpis) {
    const s = smeny_serazene(rozpis), chyby = [];
    for (let i = 1; i < s.length; i++) {
      if (s[i].od < s[i - 1].do) {
        chyby.push(chyba('prekryv', s[i].r.datum,
          'Směna ' + s[i].r.datum + ' se překrývá se směnou ' + s[i - 1].r.datum + '.'));
      }
    }
    return chyby;
  }
  function kontrola_pauzy(rozpis, pauza_h) {
    const s = smeny_serazene(rozpis), chyby = [];
    for (let i = 1; i < s.length; i++) {
      const mezera = (s[i].od - s[i - 1].do) / HOD;
      if (mezera >= 0 && mezera < pauza_h) {
        chyby.push(chyba('pauza', s[i].r.datum,
          'Pauza před směnou ' + s[i].r.datum + ' je ' + mezera + ' h (min. ' + pauza_h + ' h).'));
      }
    }
    return chyby;
  }
  function kontrola_nocnich_po_sobe(rozpis, max) {
    const chyby = [];
    let serie = 0, posl = null;
    serazene(rozpis).forEach(function (r) {
      if (r.smena !== 'N') return;
      const d = dny(r.datum);
      serie = (posl !== null && d === posl + 1) ? serie + 1 : 1;
      posl = d;
      if (serie === max + 1) {
        chyby.push(chyba('nocni', r.datum,
          'Více než ' + max + ' noční po sobě (od ' + datum_z_dnu(d - max) + ').'));
      }
    });
    return chyby;
  }
  // V každém 7denním okně (od 00:00 prvního dne) musí být souvislé volno >= min_h.
  // Kontrolují se jen úplná okna uvnitř rozpisu (první den se vynechá kvůli noční z předchozího dne).
  function kontrola_volna(rozpis, min_h) {
    const chyby = [], r = serazene(rozpis);
    if (!r.length) return chyby;
    const prvni = dny(r[0].datum), posl = dny(r[r.length - 1].datum);

  // Návrh musí projít pravidly; jediná tolerovaná výjimka je překročení max_hodin_cyklus (varování).
  function doplň_rozpis(rozpisy_osob, nastaveni) {

async function ulozAkci(){

async function smazAkci(tymId,id){

function odpovez(){

$('#ov').addEventListener('click',e=>{

  if(!g||!SH)return;

  if(ds.k&&SH.v==='den')return vyber(ds.k);
  if(ds.q&&SH.v==='den'){const p=$('#pozn'),v=p.value.trim(),r=ds.q;p.value=!v||RYCHLE.includes(v)?r:v+', '+r;if(VOLNO.includes(r))vyber('V');return}

  if(ds.typ&&SH.v==='form'){ctiForm();SH.f.typ=ds.typ;return kresliForm()}
  if(ds.pro&&SH.v==='form'){ctiForm();SH.f.tym=ds.pro==='tym';return kresliForm()}
  if(ds.uid!==undefined&&SH.v==='form'){ctiForm();const f=SH.f;f.pro=!ds.uid?[]:f.pro.includes(ds.uid)?f.pro.filter(x=>x!==ds.uid):f.pro.concat(ds.uid);return kresliForm()}

  if(ds.akce)return detailAkce(ds.akce);

    case 'kal':S.ui.osoba=SH.os;S.ui.tab='kal';anim=true;zavri();uloz();render();return scrollTo(0,0);
